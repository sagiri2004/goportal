<!DOCTYPE html>
<html lang="en">
<head>
	<title>Chess - Thomas Fisher (100198032)</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="css/style.css">
</head>
<body onload="setup();">

<main class="page-shell">
<header class="page-header">
    <h1>Thomas Fisher's and Max Shvartsman's Chess Project</h1>
    <p id="turnInfo">Player's turn: <b>White</b></p>
</header>
<section id="multiplayerControls" class="mp-card">
    <div class="mp-title-row">
        <p class="mp-title"><b>GoPortal Multiplayer (2 players)</b></p>
        <p id="mpStatus" class="mp-status">Initializing SDK...</p>
    </div>
    <div class="mp-row">
        <button id="createRoomBtn" type="button">Create Room</button>
        <input id="roomIdInput" type="text" placeholder="Room ID">
        <button id="joinRoomBtn" type="button">Join Room</button>
    </div>
    <div class="mp-row">
        <button id="copyRoomBtn" type="button">Copy Room ID</button>
        <button id="refreshRoomsBtn" type="button">Refresh Open Rooms</button>
        <button id="shareRoomBtn" type="button">Share Room</button>
        <button id="toggleReadyBtn" type="button">Ready</button>
        <button id="startMatchBtn" type="button">Start Match</button>
    </div>
    <div id="openRoomsList" class="mp-open-rooms"></div>
    <p id="lobbyInfo" class="mp-meta">Lobby: waiting players...</p>
    <p id="myRoleInfo" class="mp-meta">Role: Spectator</p>
    <p id="userInfo" class="mp-meta">User: (loading)</p>
    <div class="mp-row">
        <button id="saveProgressBtn" type="button">Save Progress</button>
        <button id="loadProgressBtn" type="button">Load Progress</button>
        <button id="submitScoreBtn" type="button">Submit Score</button>
        <button id="shareScoreBtn" type="button">Share Score</button>
    </div>
    <p id="scoreInfo" class="mp-score">Score: White 0 - Black 0</p>
</section>
<section id="board">
    <div class="overlay" id="promotionMessage">
        <div class="overlay-inner">
            <span class="overlay-title">Promotion!</span>
            <p class="overlay-text" id="alertText"></p>
            <ul id="promotionList" class="white">
                <li><a href="#" class="promotion-button queen" onclick="promote('queen');"></a></li>
                <li><a href="#" class="promotion-button castle" onclick="promote('castle');"></a></li>
                <li><a href="#" class="promotion-button bishop" onclick="promote('bishop');"></a></li>
                <li><a href="#" class="promotion-button knight" onclick="promote('knight');"></a></li>
            </ul>
        </div>
    </div>
	<div class="overlay" id="errorMessage">
		<div class="overlay-inner">
			<span class="overlay-title">Error!</span>
			<p class="overlay-text" id="errorText"></p>
			<a href="#" class="overlay-button" onclick="closeError();">Close</a>
		</div>
	</div>
	<div class="overlay" id="endMessage">
		<div class="overlay-inner">
			<span class="overlay-title">Game Over!</span>
			<p class="overlay-text" id="endText"></p>
			<a href="#" class="overlay-button" onclick="newGame();">New Game</a>
		</div>
	</div>
</section>
</main>
<script type="text/javascript" src="./goportal-game-sdk.js"></script>
<script type="text/javascript" src="js/scripts.js"></script>

</body>
</html>
