<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoPortal - Single Player Score</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
        color: #e2e8f0;
      }
      .card {
        width: min(560px, 100%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 6px; font-size: 1.35rem; }
      .hint { margin: 0; color: #94a3b8; font-size: 0.9rem; }
      .stats {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .stat {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
      }
      .label { font-size: 0.74rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
      .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; color: #a5b4fc; }
      .main {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: linear-gradient(180deg, #6366f1, #4f46e5);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      #tap-btn { padding: 14px 16px; font-size: 1.1rem; }
      #controls {
        display: flex;
        gap: 10px;
      }
      #controls button {
        flex: 1;
        padding: 10px 12px;
        font-size: 0.88rem;
      }
      #controls button.secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.45);
        color: #cbd5e1;
      }
      #status {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(2, 132, 199, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.32);
        font-size: 0.82rem;
        color: #bae6fd;
      }
      code { color: #fda4af; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Single Player - Session Score</h1>
      <p class="hint">Tap thật nhanh trong 15s. Mỗi round được lưu theo session, có thể share score lên chat.</p>
      <div class="stats">
        <div class="stat">
          <div class="label">Time Left</div>
          <div class="value" id="time-left">15.0s</div>
        </div>
        <div class="stat">
          <div class="label">Current Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="label">Best Round</div>
          <div class="value" id="best-score">0</div>
        </div>
      </div>
      <div class="main">
        <button type="button" id="tap-btn">Tap</button>
        <div id="controls">
          <button type="button" class="secondary" id="restart-btn">Restart Round</button>
          <button type="button" id="share-btn" disabled>Share Score</button>
        </div>
      </div>
      <div id="status">Initializing...</div>
    </div>

    <script src="../../game-sdk/browser/goportal-game-sdk.js"></script>
    <script>
      ;(function () {
        var sdk = window.GoPortalGameSDK
        var DURATION_MS = 15000
        var score = 0
        var best = 0
        var round = 1
        var endAt = 0
        var raf = null
        var lastRoundScore = 0
        var sessionId = ''

        var elScore = document.getElementById('score')
        var elBest = document.getElementById('best-score')
        var elTime = document.getElementById('time-left')
        var tapBtn = document.getElementById('tap-btn')
        var restartBtn = document.getElementById('restart-btn')
        var shareBtn = document.getElementById('share-btn')
        var status = document.getElementById('status')

        function setStatus(msg) {
          status.textContent = msg
        }

        function refreshScoreUI() {
          elScore.textContent = String(score)
          elBest.textContent = String(best)
        }

        function stopTimer() {
          if (raf) {
            cancelAnimationFrame(raf)
            raf = null
          }
        }

        function tick() {
          var now = Date.now()
          var left = Math.max(0, endAt - now)
          elTime.textContent = (left / 1000).toFixed(1) + 's'
          if (left <= 0) {
            finishRound()
            return
          }
          raf = requestAnimationFrame(tick)
        }

        function startRound() {
          stopTimer()
          score = 0
          refreshScoreUI()
          lastRoundScore = 0
          shareBtn.disabled = true
          endAt = Date.now() + DURATION_MS
          tapBtn.disabled = false
          setStatus('Round ' + round + ' started. Keep tapping!')
          raf = requestAnimationFrame(tick)
        }

        function finishRound() {
          stopTimer()
          tapBtn.disabled = true
          lastRoundScore = score
          if (score > best) best = score
          refreshScoreUI()
          shareBtn.disabled = false
          var key = 'single-round-' + round + '-score-' + score
          if (sdk && typeof sdk.shareScore === 'function') {
            sdk
              .shareScore(score, {
                share: false,
                idempotency_key: key,
                payload: { round: round, duration_ms: DURATION_MS },
              })
              .then(function () {
                setStatus('Round ' + round + ' saved to session. Click "Share Score" if needed.')
              })
              .catch(function (err) {
                setStatus('Round saved failed: ' + (err && err.message ? err.message : 'unknown error'))
              })
          } else {
            setStatus('SDK missing. Score still works locally.')
          }
          round += 1
        }

        tapBtn.addEventListener('click', function () {
          if (!endAt) startRound()
          if (Date.now() > endAt) return
          score += 1
          refreshScoreUI()
        })

        restartBtn.addEventListener('click', startRound)

        shareBtn.addEventListener('click', function () {
          if (!sdk || !lastRoundScore) return
          var shareKey = 'single-share-round-' + (round - 1) + '-score-' + lastRoundScore
          sdk
            .shareScore(lastRoundScore, {
              share: true,
              idempotency_key: shareKey,
              comment: 'Round ' + (round - 1) + ' đạt ' + lastRoundScore + ' điểm',
              payload: { round: round - 1, duration_ms: DURATION_MS, best_score: best },
            })
            .then(function () {
              setStatus('Shared score ' + lastRoundScore + ' to chat.')
            })
            .catch(function (err) {
              setStatus('Share failed: ' + (err && err.message ? err.message : 'unknown error'))
            })
        })

        function initSDK() {
          if (!sdk || typeof sdk.init !== 'function') {
            setStatus('GoPortal SDK not found. Include goportal-game-sdk.js')
            return Promise.resolve()
          }
          return sdk
            .init({ metadata: { mode: 'single_player_score', build: 'sample-v1' } })
            .then(function (res) {
              sessionId = res && res.session_id ? res.session_id : ''
              setStatus('SDK ready. Session: ' + (sessionId || '(hidden)'))
            })
            .catch(function (err) {
              setStatus('SDK init failed: ' + (err && err.message ? err.message : 'unknown error'))
            })
        }

        initSDK().then(function () {
          startRound()
        })
      })()
    </script>
  </body>
</html>
