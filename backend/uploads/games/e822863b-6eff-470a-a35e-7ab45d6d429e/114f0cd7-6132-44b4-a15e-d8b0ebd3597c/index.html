<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoPortal - Tank Battle Complete SDK Sample</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        min-height: 100vh;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 15% 10%, #1e293b 0%, #0f172a 58%, #020617 100%);
        color: #e2e8f0;
      }
      .app { max-width: 1100px; margin: 0 auto; display: grid; gap: 10px; }
      .panel {
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 12px;
        padding: 10px 12px;
      }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .row.spread { justify-content: space-between; }
      .small { font-size: 0.78rem; color: #94a3b8; }
      .kbd {
        display: inline-block;
        font-size: 0.72rem;
        padding: 2px 6px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 6px;
        margin-right: 4px;
      }
      input, button {
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: #0f172a;
        color: #e2e8f0;
        padding: 8px 10px;
        font-size: 0.85rem;
      }
      input { min-width: 230px; }
      button {
        border-color: transparent;
        background: linear-gradient(180deg, #6366f1, #4338ca);
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        border-color: rgba(148, 163, 184, 0.45);
        color: #cbd5e1;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #board {
        width: 100%;
        height: 560px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: #020617;
      }
      #status {
        min-height: 18px;
        color: #93c5fd;
        font-size: 0.84rem;
      }
      #share-status {
        min-height: 18px;
        color: #f9a8d4;
        font-size: 0.8rem;
      }
      #scoreboard {
        font-size: 0.86rem;
        color: #cbd5e1;
      }
      #event-log {
        margin: 0;
        white-space: pre-wrap;
        font-size: 0.76rem;
        color: #cbd5e1;
        max-height: 140px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="panel">
        <div class="row spread">
          <strong>Tank Battle Complete - GoPortal SDK v2</strong>
          <div class="small">
            <span class="kbd">WASD / Arrows</span>
            <span class="kbd">Space</span> Shoot
          </div>
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="create-room">Create Room</button>
          <input id="room-id-input" placeholder="Room ID to join" />
          <button id="join-room" class="secondary">Join Room</button>
          <button id="leave-room" class="secondary">Leave</button>
          <button id="sync-room" class="secondary">Sync State</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="share-now-playing" class="secondary">Share Now Playing</button>
          <button id="share-score" class="secondary">Share Score</button>
          <button id="share-achievement" class="secondary">Share Achievement</button>
          <button id="share-game" class="secondary">Share Game Card</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <div class="small">Room: <code id="room-label">-</code></div>
          <div class="small">Version: <code id="version-label">0</code></div>
          <div class="small">You: <code id="self-label">unknown</code></div>
          <div class="small">Kills: <code id="kills-label">0</code></div>
        </div>
        <div id="status">Waiting SDK...</div>
        <div id="share-status"></div>
      </div>

      <canvas id="board" width="1060" height="560"></canvas>

      <div class="panel">
        <div id="scoreboard">No players</div>
      </div>

      <div class="panel">
        <strong style="font-size: 0.86rem">Event Log</strong>
        <pre id="event-log"></pre>
      </div>
    </div>

    <script src="./goportal-game-sdk.js"></script>
    <script>
      ;(function () {
        var sdk = window.GoPortalGameSDK
        var board = document.getElementById('board')
        var ctx = board.getContext('2d')

        var roomLabel = document.getElementById('room-label')
        var versionLabel = document.getElementById('version-label')
        var selfLabel = document.getElementById('self-label')
        var killsLabel = document.getElementById('kills-label')
        var statusEl = document.getElementById('status')
        var shareStatusEl = document.getElementById('share-status')
        var scoreEl = document.getElementById('scoreboard')
        var eventLogEl = document.getElementById('event-log')
        var roomInput = document.getElementById('room-id-input')

        var keys = Object.create(null)
        var fireCooldown = 0
        var publishPending = false
        var nowPlayingShared = false
        var roomId = ''
        var selfUserId = ''
        var stateVersion = 0
        var sdkSessionId = ''
        var localUserId = ''
        var didShareAchievement = false
        var expectSelfFromNextRoomEvent = false
        var colorPool = ['#60a5fa', '#f472b6', '#34d399', '#facc15', '#f97316', '#a78bfa', '#22d3ee']

        var state = {
          players: {},
          projectiles: [],
          updated_at: Date.now(),
        }

        board.setAttribute('tabindex', '0')

        function setStatus(text) {
          statusEl.textContent = text
        }

        function setShareStatus(text) {
          shareStatusEl.textContent = text
        }

        function logEvent(message) {
          var now = new Date().toLocaleTimeString()
          var line = '[' + now + '] ' + message
          eventLogEl.textContent = line + '\n' + eventLogEl.textContent.split('\n').slice(0, 11).join('\n')
        }

        function randomPos() {
          return {
            x: 60 + Math.random() * (board.width - 120),
            y: 60 + Math.random() * (board.height - 120),
          }
        }

        function hashSeed(text) {
          var hash = 0
          for (var i = 0; i < text.length; i += 1) {
            hash = (hash * 33 + text.charCodeAt(i)) % 2147483647
          }
          return hash
        }

        function deterministicSpawn(userId) {
          var h1 = hashSeed('x:' + userId)
          var h2 = hashSeed('y:' + userId)
          return {
            x: 50 + (h1 % (board.width - 100)),
            y: 50 + (h2 % (board.height - 100)),
          }
        }

        function makePlayer(userId, name) {
          var p = deterministicSpawn(userId)
          return {
            user_id: userId,
            name: name || userId.slice(0, 8),
            x: p.x,
            y: p.y,
            dir: 0,
            hp: 100,
            kills: 0,
            color: colorPool[Math.floor(Math.random() * colorPool.length)],
          }
        }

        function ensureSelfPlayer() {
          if (!selfUserId) return
          if (!state.players[selfUserId]) {
            state.players[selfUserId] = makePlayer(selfUserId, 'you')
            queuePublish()
          }
        }

        function setRoomInfo() {
          roomLabel.textContent = roomId || '-'
          versionLabel.textContent = String(stateVersion)
          selfLabel.textContent = selfUserId || 'unknown'
          var kills = selfUserId && state.players[selfUserId] ? state.players[selfUserId].kills : 0
          killsLabel.textContent = String(kills)
        }

        function applyRoomSnapshot(roomState, preferNewerOnly) {
          if (!roomState || !roomState.room) return
          var incomingVersion = Number(roomState.room.state_version || 0)
          if (preferNewerOnly && incomingVersion > 0 && incomingVersion <= stateVersion) {
            return
          }
          roomId = roomState.room.id
          stateVersion = incomingVersion
          if (roomState.room.current_state && roomState.room.current_state.players) {
            state = roomState.room.current_state
          } else {
            state = { players: {}, projectiles: [], updated_at: Date.now() }
          }
          if (!Array.isArray(state.projectiles)) {
            state.projectiles = []
          }
          if (Array.isArray(roomState.members)) {
            roomState.members.forEach(function (member) {
              if (!state.players[member.user_id]) {
                state.players[member.user_id] = makePlayer(member.user_id, member.user_id === selfUserId ? 'you' : member.user_id.slice(0, 8))
              }
            })
          }
          if (!selfUserId && localUserId) {
            selfUserId = localUserId
          }
          ensureSelfPlayer()
          setRoomInfo()
          render()
        }

        function queuePublish() {
          if (!roomId || !selfUserId || publishPending) return
          publishPending = true
          setTimeout(function () {
            publishPending = false
            publishState()
          }, 120)
        }

        function publishState() {
          if (!sdk || !roomId || !selfUserId) return
          var nextVersion = stateVersion + 1
          state.updated_at = Date.now()
          sdk
            .sendState(roomId, state, nextVersion)
            .then(function () {
              stateVersion = nextVersion
              setRoomInfo()
            })
            .catch(function (err) {
              setStatus('sendState failed: ' + (err && err.message ? err.message : 'unknown error'))
            })
        }

        function shareCurrentScore() {
          if (!sdk || !selfUserId || !state.players[selfUserId]) return
          var score = state.players[selfUserId].kills || 0
          sdk
            .shareScore(score, {
              comment: 'Tank Battle - kills: ' + score,
              idempotency_key: 'tank-score-' + Date.now(),
              payload: { room_id: roomId || null, mode: 'tank_complete' },
            })
            .then(function (res) {
              setShareStatus('Score share: ' + res.share_status)
              logEvent('shareScore => ' + JSON.stringify(res))
            })
            .catch(function (err) {
              setShareStatus('Score share failed: ' + (err && err.message ? err.message : 'unknown'))
            })
        }

        function shareAchievement() {
          if (!sdk) return
          sdk
            .shareAchievement({
              achievement_code: 'ACE_GUNNER',
              achievement_title: 'Ace Gunner',
              comment: 'Unlocked Ace Gunner in Tank Battle',
              idempotency_key: 'tank-achievement-' + Date.now(),
              payload: { room_id: roomId || null },
            })
            .then(function (res) {
              setShareStatus('Achievement share: ' + res.share_status)
              logEvent('shareAchievement => ' + JSON.stringify(res))
            })
            .catch(function (err) {
              setShareStatus('Achievement share failed: ' + (err && err.message ? err.message : 'unknown'))
            })
        }

        function maybeAutoShareAchievement() {
          if (!selfUserId || !state.players[selfUserId]) return
          if (didShareAchievement) return
          if (state.players[selfUserId].kills >= 3) {
            didShareAchievement = true
            shareAchievement()
          }
        }

        function shoot() {
          if (!selfUserId || !state.players[selfUserId]) return
          var me = state.players[selfUserId]
          var hitId = ''
          var nearestDist = 99999
          Object.keys(state.players).forEach(function (uid) {
            if (uid === selfUserId) return
            var p = state.players[uid]
            var dx = p.x - me.x
            var dy = p.y - me.y
            var dist = Math.sqrt(dx * dx + dy * dy)
            if (dist < 300 && dist < nearestDist) {
              nearestDist = dist
              hitId = uid
            }
          })
          if (!hitId) {
            setStatus('Shot fired (no hit)')
            queuePublish()
            return
          }
          var target = state.players[hitId]
          me.dir = Math.atan2(target.y - me.y, target.x - me.x)
          target.hp -= 34
          if (target.hp <= 0) {
            target.hp = 100
            var respawn = randomPos()
            target.x = respawn.x
            target.y = respawn.y
            me.kills += 1
            setStatus('You destroyed ' + target.name + '!')
            maybeAutoShareAchievement()
          }
          queuePublish()
        }

        function handleRealtimeEvent(ev) {
          if (!ev) return

          if (ev.event_type === 'gop.sdk.share_status') {
            setShareStatus('Share event: ' + String(ev.status) + ' (' + String(ev.share_action) + ')')
            logEvent('share_status => ' + JSON.stringify(ev))
            return
          }

          if (!ev.room_id || (roomId && ev.room_id !== roomId)) {
            return
          }

          if (ev.event_type === 'GAME_ROOM_STATE_UPDATED' && ev.state) {
            var incomingVersion = Number(ev.state_version || 0)
            if (incomingVersion && incomingVersion < stateVersion) return
            if (incomingVersion) stateVersion = incomingVersion
            state = ev.state
            if (!Array.isArray(state.projectiles)) state.projectiles = []
            if (!selfUserId && expectSelfFromNextRoomEvent && ev.actor_user_id && state.players && state.players[ev.actor_user_id]) {
              selfUserId = ev.actor_user_id
              expectSelfFromNextRoomEvent = false
            }
            ensureSelfPlayer()
            setRoomInfo()
            render()
            return
          }

          if (ev.event_type === 'GAME_ROOM_MEMBER_JOINED' || ev.event_type === 'GAME_ROOM_CREATED') {
            if (!selfUserId && expectSelfFromNextRoomEvent && ev.actor_user_id) {
              selfUserId = ev.actor_user_id
              expectSelfFromNextRoomEvent = false
            }
            ;(ev.member_user_ids || []).forEach(function (uid) {
              if (!state.players[uid]) {
                state.players[uid] = makePlayer(uid, uid === selfUserId ? 'you' : uid.slice(0, 8))
              }
            })
            render()
          }
        }

        function update(dt) {
          if (!selfUserId || !state.players[selfUserId]) return
          var me = state.players[selfUserId]
          var speed = 190
          var vx = 0
          var vy = 0
          if (keys.ArrowUp || keys.KeyW) vy -= 1
          if (keys.ArrowDown || keys.KeyS) vy += 1
          if (keys.ArrowLeft || keys.KeyA) vx -= 1
          if (keys.ArrowRight || keys.KeyD) vx += 1
          if (vx !== 0 || vy !== 0) {
            var len = Math.sqrt(vx * vx + vy * vy)
            vx /= len
            vy /= len
            me.x += vx * speed * dt
            me.y += vy * speed * dt
            me.x = Math.max(24, Math.min(board.width - 24, me.x))
            me.y = Math.max(24, Math.min(board.height - 24, me.y))
            me.dir = Math.atan2(vy, vx)
            queuePublish()
          }
          fireCooldown = Math.max(0, fireCooldown - dt)
        }

        function drawTank(p, isSelf) {
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.dir)
          ctx.fillStyle = p.color
          ctx.fillRect(-18, -14, 36, 28)
          ctx.fillStyle = '#e2e8f0'
          ctx.fillRect(0, -3, 26, 6)
          ctx.restore()

          ctx.fillStyle = '#e2e8f0'
          ctx.font = '12px system-ui'
          ctx.fillText((isSelf ? '[you] ' : '') + p.name + ' (' + p.kills + ')', p.x - 28, p.y - 23)

          ctx.fillStyle = '#1f2937'
          ctx.fillRect(p.x - 20, p.y + 18, 40, 5)
          ctx.fillStyle = '#22c55e'
          ctx.fillRect(p.x - 20, p.y + 18, Math.max(0, p.hp / 100) * 40, 5)
        }

        function render() {
          ctx.clearRect(0, 0, board.width, board.height)
          ctx.fillStyle = '#0f172a'
          ctx.fillRect(0, 0, board.width, board.height)
          Object.keys(state.players).forEach(function (uid) {
            drawTank(state.players[uid], uid === selfUserId)
          })
          var ranking = Object.keys(state.players)
            .map(function (uid) { return state.players[uid] })
            .sort(function (a, b) { return b.kills - a.kills })
            .map(function (p) { return p.name + ': ' + p.kills + ' kills' })
          scoreEl.textContent = ranking.length ? ranking.join(' | ') : 'No players'
        }

        function bindUI() {
          document.getElementById('create-room').addEventListener('click', function () {
            if (!sdk) return
            expectSelfFromNextRoomEvent = true
            sdk
              .createRoom({ room_name: 'Tank Arena Complete', max_players: 8 })
              .then(function (roomState) {
                applyRoomSnapshot(roomState, false)
                setStatus('Room created: ' + roomId)
                board.focus()
                return sdk.subscribeRoom(roomId)
              })
              .then(function () {
                logEvent('Subscribed room: ' + roomId)
              })
              .catch(function (err) {
                setStatus('Create room failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })

          document.getElementById('join-room').addEventListener('click', function () {
            if (!sdk) return
            var target = String(roomInput.value || '').trim()
            if (!target) {
              setStatus('Enter room ID first')
              return
            }
            expectSelfFromNextRoomEvent = true
            sdk
              .joinRoom(target)
              .then(function (roomState) {
                applyRoomSnapshot(roomState, false)
                setStatus('Joined room: ' + roomId)
                board.focus()
                return sdk.subscribeRoom(roomId)
              })
              .then(function () {
                logEvent('Subscribed room: ' + roomId)
              })
              .catch(function (err) {
                setStatus('Join failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })

          document.getElementById('leave-room').addEventListener('click', function () {
            if (!sdk || !roomId) return
            sdk
              .leaveRoom(roomId)
              .then(function () {
                roomId = ''
                stateVersion = 0
                state = { players: {}, projectiles: [], updated_at: Date.now() }
                didShareAchievement = false
                setStatus('Left room')
                setRoomInfo()
                render()
              })
              .catch(function (err) {
                setStatus('Leave failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })

          document.getElementById('sync-room').addEventListener('click', function () {
            if (!sdk || !roomId) return
            sdk
              .getRoomState(roomId)
              .then(function (roomState) {
                applyRoomSnapshot(roomState, false)
                setStatus('Room synced')
              })
              .catch(function (err) {
                setStatus('Sync failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })

          document.getElementById('share-now-playing').addEventListener('click', function () {
            if (!sdk || !sdk.commands || typeof sdk.commands.shareSessionStart !== 'function') {
              setShareStatus('shareSessionStart not available in this SDK build')
              return
            }
            sdk.commands
              .shareSessionStart({
                comment: 'Playing Tank Battle Complete',
              })
              .then(function (res) {
                nowPlayingShared = true
                setShareStatus('Now playing share: ' + res.share_status)
                logEvent('shareSessionStart => ' + JSON.stringify(res))
              })
              .catch(function (err) {
                setShareStatus('Now playing failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })

          document.getElementById('share-score').addEventListener('click', shareCurrentScore)
          document.getElementById('share-achievement').addEventListener('click', shareAchievement)

          document.getElementById('share-game').addEventListener('click', function () {
            if (!sdk) return
            sdk
              .shareGame({
                comment: 'Join me in Tank Battle Complete!',
              })
              .then(function (res) {
                setShareStatus('Game card share: ' + (res && res.share_status ? res.share_status : 'ok'))
                logEvent('shareGame => ' + JSON.stringify(res || {}))
              })
              .catch(function (err) {
                setShareStatus('Share game failed: ' + (err && err.message ? err.message : 'unknown'))
              })
          })
        }

        function bindInput() {
          function isTypingTarget(target) {
            return !!(target && typeof target.closest === 'function' && target.closest('input, textarea, select, [contenteditable="true"]'))
          }

          function shouldCapture(code) {
            return code === 'Space' || code === 'ArrowUp' || code === 'ArrowDown' || code === 'ArrowLeft' || code === 'ArrowRight' || code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD'
          }

          board.addEventListener('pointerdown', function () {
            board.focus()
          })

          window.addEventListener('blur', function () {
            keys = Object.create(null)
          })

          document.addEventListener('keydown', function (e) {
            if (isTypingTarget(e.target)) return
            if (shouldCapture(e.code)) {
              e.preventDefault()
            }
            keys[e.code] = true
            if (e.code === 'Space' && fireCooldown === 0) {
              fireCooldown = 0.18
              shoot()
            }
          })
          document.addEventListener('keyup', function (e) {
            if (isTypingTarget(e.target)) return
            if (shouldCapture(e.code)) {
              e.preventDefault()
            }
            keys[e.code] = false
          })
        }

        function gameLoop() {
          var last = performance.now()
          function frame(now) {
            var dt = Math.min(0.05, (now - last) / 1000)
            last = now
            update(dt)
            render()
            requestAnimationFrame(frame)
          }
          requestAnimationFrame(frame)
        }

        function initSDK() {
          if (!sdk || typeof sdk.ready !== 'function' || typeof sdk.init !== 'function') {
            setStatus('GoPortal SDK missing. Please include goportal-game-sdk.js')
            return Promise.resolve()
          }

          sdk.on('*', handleRealtimeEvent)

          return sdk
            .ready()
            .then(function (handshake) {
              logEvent('ready => protocol ' + String(handshake.protocol_version || 'unknown'))
              if (handshake && handshake.context && handshake.context.user_id) {
                localUserId = String(handshake.context.user_id)
                selfUserId = localUserId
              }
              return sdk.init({
                metadata: {
                  mode: 'tank_battle_complete',
                  build: 'sample-v3',
                },
              })
            })
            .then(function (session) {
              sdkSessionId = session && session.session_id ? session.session_id : ''
              setStatus('SDK ready. Session: ' + (sdkSessionId || '(hidden)'))
              board.focus()
              if (!nowPlayingShared && sdk.commands && typeof sdk.commands.shareSessionStart === 'function') {
                return sdk.commands.shareSessionStart({
                  comment: 'Tank Battle Complete just started',
                  share: true,
                })
              }
              return null
            })
            .then(function (shareRes) {
              if (shareRes) {
                nowPlayingShared = true
                setShareStatus('Auto now-playing share: ' + shareRes.share_status)
                logEvent('auto shareSessionStart => ' + JSON.stringify(shareRes))
              }
            })
            .catch(function (err) {
              setStatus('SDK init failed: ' + (err && err.message ? err.message : 'unknown'))
            })
        }

        bindUI()
        bindInput()
        gameLoop()
        initSDK().then(function () {
          setRoomInfo()
          render()
        })
      })()
    </script>
  </body>
</html>
