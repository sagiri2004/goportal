<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Sprint</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0c1110; color: #ecfeff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 80% 10%, #166534 0, transparent 30%), #0c1110; }
    main { width: min(92vw, 520px); }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #a7f3d0; }
    canvas { width: 100%; aspect-ratio: 1; display: block; border: 1px solid #14532d; border-radius: 12px; background: #052e16; }
    button { border: 1px solid #15803d; background: #064e3b; color: #ecfeff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Snake Sprint</h1>
    <div class="bar"><strong id="score">Score 0</strong><button id="reset">Restart</button></div>
    <canvas id="game" width="480" height="480"></canvas>
  </main>
  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.querySelector('#score');
    const size = 24;
    const cols = canvas.width / size;
    let snake, dir, nextDir, food, score, over;

    function reset() {
      snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
      dir = nextDir = {x: 1, y: 0};
      food = spawn();
      score = 0;
      over = false;
      draw();
    }

    function spawn() {
      let p;
      do p = {x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * cols)};
      while (snake.some(s => s.x === p.x && s.y === p.y));
      return p;
    }

    function tick() {
      if (over) return;
      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= cols || snake.some(s => s.x === head.x && s.y === head.y)) over = true;
      if (!over) {
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) { score += 10; food = spawn(); }
        else snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#052e16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fb7185'; ctx.fillRect(food.x * size + 4, food.y * size + 4, size - 8, size - 8);
      snake.forEach((s, i) => { ctx.fillStyle = i ? '#34d399' : '#a7f3d0'; ctx.fillRect(s.x * size + 2, s.y * size + 2, size - 4, size - 4); });
      scoreEl.textContent = over ? `Game over · Score ${score}` : `Score ${score}`;
    }

    addEventListener('keydown', e => {
      const map = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}, w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}};
      const n = map[e.key];
      if (!n || (n.x === -dir.x && n.y === -dir.y)) return;
      nextDir = n;
    });
    document.querySelector('#reset').addEventListener('click', reset);
    reset();
    setInterval(tick, 115);
  </script>
</body>
</html>
