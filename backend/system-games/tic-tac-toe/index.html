<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101114; color: #f4f4f5; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top left, #155e75 0, transparent 32%), #101114; }
    main { width: min(92vw, 430px); }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; color: #a1a1aa; }
    button { border: 1px solid #3f3f46; background: #18181b; color: #f4f4f5; border-radius: 8px; cursor: pointer; }
    .reset { padding: 8px 12px; }
    .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cell { aspect-ratio: 1; font-size: clamp(44px, 16vw, 74px); font-weight: 800; border-color: #52525b; background: #27272a; }
    .cell:hover { background: #3f3f46; }
    .x { color: #67e8f9; }
    .o { color: #fda4af; }
  </style>
</head>
<body>
  <main>
    <h1>Tic Tac Toe</h1>
    <div class="bar">
      <strong id="status">X to move</strong>
      <button class="reset" id="reset">New game</button>
    </div>
    <section class="board" id="board" aria-label="Tic tac toe board"></section>
  </main>
  <script>
    const board = document.querySelector('#board');
    const statusEl = document.querySelector('#status');
    const reset = document.querySelector('#reset');
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let cells = Array(9).fill('');
    let turn = 'X';
    let done = false;

    function winner() {
      for (const [a,b,c] of wins) if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a];
      return cells.every(Boolean) ? 'draw' : '';
    }

    function render() {
      board.innerHTML = '';
      cells.forEach((value, index) => {
        const button = document.createElement('button');
        button.className = `cell ${value.toLowerCase()}`;
        button.textContent = value;
        button.addEventListener('click', () => move(index));
        board.appendChild(button);
      });
      const result = winner();
      done = Boolean(result);
      statusEl.textContent = result === 'draw' ? 'Draw game' : result ? `${result} wins` : `${turn} to move`;
    }

    function move(index) {
      if (done || cells[index]) return;
      cells[index] = turn;
      turn = turn === 'X' ? 'O' : 'X';
      render();
    }

    reset.addEventListener('click', () => { cells = Array(9).fill(''); turn = 'X'; done = false; render(); });
    render();
  </script>
</body>
</html>
