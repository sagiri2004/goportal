  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   command: ["-config", "configs/config.yaml", "-migrate"]
  #   ports:
  #     - "8080:8080"
