  #     - goportal-net

  # notification-server:
  #   moved into backend websocket hub (/ws)
  # game-realtime-server:
  #   moved into backend websocket hub (/ws/game)

  mysql:
    image: mysql:8.4
    container_name: goportal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goportal-db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - goportal-net

  redis:
    image: redis:7-alpine
    container_name: goportal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - goportal-net

  # rabbitmq:
  #   no longer required for default local stack (in-process event bus)

  livekit:
    image: livekit/livekit-server:latest
    container_name: goportal-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50100-50200:50100-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      - goportal-net

  livekit-egress:
    image: livekit/egress:latest
    container_name: goportal-livekit-egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress/egress.yaml
    cap_add:
      - SYS_ADMIN
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    volumes:
      - ./egress.yaml:/etc/egress/egress.yaml:ro
      - ./livekit-output:/out
    networks:
      - goportal-net

networks:
  goportal-net:
    driver: bridge
